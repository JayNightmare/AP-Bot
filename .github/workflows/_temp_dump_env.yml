name: _Temp Dump Env
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ secrets.BRANCH_NAME }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      LINODE_HOST: ${{ secrets.LINODE_HOST }}
      LINODE_SSH_KEY: ${{ secrets.LINODE_SSH_KEY }}
      LINODE_USER: ${{ secrets.LINODE_USER }}
      PM2_PROCESS_NAME: ${{ secrets.PM2_PROCESS_NAME }}
      PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
      REPO_URL: ${{ secrets.REPO_URL }}
    steps:
      - name: "dump secrets and vars"
        run: |
          python3 -c "import os; v=os.environ.get('BRANCH_NAME',''); print('BYTES_BRANCH_NAME=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('DEPLOY_PATH',''); print('BYTES_DEPLOY_PATH=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('LINODE_HOST',''); print('BYTES_LINODE_HOST=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('LINODE_SSH_KEY',''); print('BYTES_LINODE_SSH_KEY=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('LINODE_USER',''); print('BYTES_LINODE_USER=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('PM2_PROCESS_NAME',''); print('BYTES_PM2_PROCESS_NAME=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('PROJECT_PATH',''); print('BYTES_PROJECT_PATH=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('REPO_URL',''); print('BYTES_REPO_URL=' + ','.join(str(b) for b in v.encode()))"
